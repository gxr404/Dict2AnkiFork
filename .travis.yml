dist: trusty
sudo: true
language: python
python:
  - '3.6'
services:
  - xvfb
install:
  - pip install -r requirements.txt
  - export PYTHONPATH=$TRAVIS_BUILD_DIR
  - export PYTHONDONTWRITEBYTECODE=1
script: xvfb-run --server-args="-screen 0 1024x768x24" pytest -v
env:
  global:
    - ANKI_ADDON_ID: 456732182

deploy:
  - provider: script
    script: python deploy.py
    on:
      branch: master

  - provider: releases
    api-key:
      secure: 
    file_glob: true
    file: Dict2Anki-*.zip
    skip_cleanup: false
    draft: true
    on:
      branch: master
